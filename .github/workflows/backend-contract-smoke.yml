name: Backend Contract Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract
          POSTGRES_DB: working_actor_os_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract -d working_actor_os_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://contract:contract@127.0.0.1:5432/working_actor_os_contract_test
      ALLOW_TEST_DATABASE_RESET: "true"
      ENVIRONMENT: contract_test
      UPLOAD_DIR: /tmp/working-actor-os-contract-uploads
      WEB_SEARCH_PROVIDER: none
      TRAVEL_PROVIDER: manual
      SCHEDULER_ENABLED: "false"
      NOTIFICATIONS_ENABLED: "false"
      PUBLIC_PROFILE_IMPORT_ENABLED: "false"
      OPENAI_API_KEY: ""
      PARALLEL_API_KEY: ""
      OPENROUTESERVICE_API_KEY: ""
      GOOGLE_MAPS_API_KEY: ""
      MAPBOX_ACCESS_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: mkdir -p "$UPLOAD_DIR"
      - run: python -m alembic upgrade head
      - run: python -m pytest -m contract_smoke
