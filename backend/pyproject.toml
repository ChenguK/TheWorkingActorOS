[project]
name = "working-actor-os-backend"
version = "0.1.0"
description = "FastAPI backend for The Working Actor OS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.8.0",
  "playwright>=1.49.0",
  "pypdf>=5.0.0",
  "parallel-web>=1.1.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.20",
  "reportlab>=4.2.0",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = [
  "contract_smoke: real FastAPI and PostgreSQL contract smoke tests",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
